name: OSSF Scorecard

# Publishes an OpenSSF Scorecard supply-chain security score for the
# repo (badge-able, and surfaced in GitHub's security tab via SARIF).
# Scorecard's checks only produce meaningful results on a public repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5  # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea  # v3.29.0
        with:
          sarif_file: results.sarif
