name: OSSF Scorecard

# Publishes an OpenSSF Scorecard supply-chain security score for the
# repo (badge-able, and surfaced in GitHub's security tab via SARIF).
# Scorecard's checks only produce meaningful results on a public repo.
on:
  push:
    branches: [main]
  schedule:
    - cron: "27 3 * * 2"
  workflow_dispatch:

permissions: read-all

jobs:
  analyze:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@3b0bd1d116c0bde30213346b22d4f634d96a2fb0  # v3.29.0
        with:
          sarif_file: results.sarif
