name: Dependabot auto-merge

# Enables GitHub's native auto-merge on Dependabot PRs once opened, so
# they merge themselves automatically as soon as all required status
# checks (the "Build and test" workflow, see ci.yml) pass — no need to
# also gate on a specific update-type here: branch protection's required
# checks are what actually block the merge until CI is green.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Approve the PR
        run: gh pr review --approve "$PR_URL" || echo "PR already approved"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        run: gh pr merge --auto --squash "$PR_URL" || echo "Auto-merge already enabled"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
