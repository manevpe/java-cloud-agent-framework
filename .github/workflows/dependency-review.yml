name: Dependency review

# Blocks PRs that introduce a known-vulnerable dependency version or a
# disallowed license, across every ecosystem manifest touched in the
# diff (Gradle, GitHub Actions, Docker base images).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.5.0
        with:
          fail-on-severity: high
