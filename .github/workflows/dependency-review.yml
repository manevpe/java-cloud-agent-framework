name: Dependency review

# Blocks PRs that introduce a known-vulnerable dependency version or a
# disallowed license, across every ecosystem manifest touched in the
# diff (Gradle, GitHub Actions, Docker base images).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec  # v4.5.0
        with:
          fail-on-severity: high
