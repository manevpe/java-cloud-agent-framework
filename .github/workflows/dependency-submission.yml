name: Dependency submission

# Submits an accurate, resolved dependency graph (including transitive
# Gradle dependencies across every module) to GitHub's dependency graph,
# which both Dependabot version updates and the dependency-review
# workflow rely on for accurate vulnerability/license data.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
