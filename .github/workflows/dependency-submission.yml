name: Dependency submission

# Submits an accurate, resolved dependency graph (including transitive
# Gradle dependencies across every module) to GitHub's dependency graph,
# which both Dependabot version updates and the dependency-review
# workflow rely on for accurate vulnerability/license data.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92  # v4.3.1
