name: Release Please

# Maintains a release PR (changelog + version bump) from Conventional
# Commits on main, and cuts a GitHub release + tag when that PR is
# merged. See release-please-config.json / .release-please-manifest.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5  # v4.3.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
