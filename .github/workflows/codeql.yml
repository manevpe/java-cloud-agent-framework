name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan to catch newly-published CVE/query-pack findings even
    # without a code change.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v3.29.0
        with:
          languages: java-kotlin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6  # v4.3.1

      # Autobuild doesn't reliably handle this multi-module Gradle build
      # (13+ modules, custom toolchain wiring in the root build.gradle.kts),
      # so build explicitly the same way CI does.
      - name: Build
        run: ./gradlew assemble --no-daemon

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee  # v3.29.0
        with:
          category: "/language:java-kotlin"
