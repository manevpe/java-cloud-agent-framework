apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "java-cloud-agent-framework.fullname" . }}
  labels:
    {{- include "java-cloud-agent-framework.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "java-cloud-agent-framework.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Forces a rolling restart on `helm upgrade` whenever the
        # ConfigMap (non-secret config or workflow YAML files) changes —
        # WorkflowDefinitionRegistry and the *Properties records only read
        # their config once at startup, so pods must restart to pick up
        # changes even though Kubernetes updates the mounted volume/env
        # source in place.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "java-cloud-agent-framework.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "java-cloud-agent-framework.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.plugins.initContainers }}
      {{- if $.Values.plugins.enabled }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "java-cloud-agent-framework.fullname" . }}
            - secretRef:
                name: {{ include "java-cloud-agent-framework.secretName" . }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Workflow definition YAML — see the Dockerfile's
            # AGENTIC_WORKFLOWS_DIRECTORY default (/config/workflows).
            # Changing a workflow = editing values.workflows + `helm
            # upgrade`, no image rebuild.
            - name: workflows
              mountPath: /config/workflows
              readOnly: true
            {{- if .Values.plugins.enabled }}
            - name: plugins
              mountPath: {{ .Values.plugins.mountPath }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: workflows
          configMap:
            name: {{ include "java-cloud-agent-framework.fullname" . }}-workflows
        {{- if .Values.plugins.enabled }}
        - name: plugins
          {{- toYaml .Values.plugins.volume | nindent 10 }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
